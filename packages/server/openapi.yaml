openapi: 3.0.3
info:
  title: Jira Clone API
  description: >
    REST API for this self-hostable, Jira-like issue tracker. Every route
    actually mounted by the server (see `src/index.ts`) is documented below,
    generated by hand directly from the route definitions under
    `src/modules/*/*.routes.ts` rather than written separately from the code.


    ## Authentication

    Almost every endpoint requires a JSON Web Token sent as
    `Authorization: Bearer <token>`. Obtain one by calling `POST /auth/login`
    (or `POST /auth/register` for a brand-new account — the very first user
    ever registered on an instance is automatically made a system ADMIN) or
    by accepting an invite via `POST /invites/{token}/accept`. Tokens expire
    after `JWT_EXPIRES_IN` (1 day by default) and carry the user's id, email
    and system role; there is no refresh endpoint — log in again once a
    token expires.


    Project-scoped endpoints additionally require project membership at or
    above a minimum project role (VIEWER < MEMBER < ADMIN); a system ADMIN
    is implicitly granted ADMIN on every project. Endpoints under `/admin`
    require the system ADMIN role.


    ## Webhooks

    See the `Webhooks` tag below for the CRUD/test/delivery-log API, and the
    `WebhookDelivery` description for the exact HMAC-SHA256 signing scheme
    an external receiver must replicate to verify a delivery.
  version: "1.0.0"
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Projects
  - name: Issues
  - name: Board
  - name: Workflow
  - name: Sprints
  - name: Backlog
  - name: Reports
  - name: Labels
  - name: Custom Fields
  - name: Filters
  - name: Comments
  - name: Attachments
  - name: Notifications
  - name: Admin — Branding & SMTP
  - name: Admin — Users
  - name: Admin — Invites
  - name: Admin — Teams
  - name: Public Invites
  - name: Me
  - name: Teams
  - name: Workload
  - name: Activity
  - name: Webhooks
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }

  # --- Auth ---------------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: >
        The first account ever created on a fresh instance is automatically
        made a system ADMIN; every account after that is a MEMBER.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201": { $ref: "#/components/responses/AuthResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AuthResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the caller's own account
      responses:
        "200":
          description: The caller's account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSummary" }
        "401": { $ref: "#/components/responses/Error" }

  # --- Users ---------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      summary: List active (non-deactivated) users
      parameters:
        - { $ref: "#/components/parameters/Search" }
      responses:
        "200":
          description: Up to 50 matching users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }

  # --- Projects -------------------------------------------------------------
  /projects:
    get:
      tags: [Projects]
      summary: List projects visible to the caller
      description: A system ADMIN sees every project; anyone else sees only projects they are a member of.
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      tags: [Projects]
      summary: Create a project
      description: The creator becomes the project's lead and its first ADMIN member. A key is auto-derived from the name if omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 2000 }
                key: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}$" }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Projects]
      summary: Get a project (requires VIEWER)
      responses:
        "200": { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Projects]
      summary: Update a project (requires project ADMIN)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string, nullable: true, maxLength: 2000 }
                leadId: { type: string, format: uuid, nullable: true }
      responses:
        "200": { description: Updated project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
    delete:
      tags: [Projects]
      summary: Delete a project (requires project ADMIN)
      responses:
        "204": { description: Deleted }
  /projects/{projectId}/star:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [Projects]
      summary: Star a project (requires VIEWER)
      responses:
        "201": { description: Starred, content: { application/json: { schema: { type: object, properties: { starred: { type: boolean } } } } } }
    delete:
      tags: [Projects]
      summary: Unstar a project (requires VIEWER)
      responses:
        "204": { description: Unstarred }
  /projects/{projectId}/members:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [Projects]
      summary: Add/update a project member (requires project ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "201": { description: Membership, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
  /projects/{projectId}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Projects]
      summary: Remove a project member (requires project ADMIN)
      responses:
        "204": { description: Removed }
  /projects/{projectId}/members/bulk-add-team:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [Projects]
      summary: Add every member of a Team as a project member (requires project ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId: { type: string, format: uuid }
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "201":
          description: Counts
          content:
            application/json:
              schema: { type: object, properties: { added: { type: integer }, skipped: { type: integer } } }

  # --- Issues ---------------------------------------------------------------
  /projects/{projectId}/issues:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Issues]
      summary: List issues in a project (requires VIEWER)
      parameters:
        - { name: assigneeId, in: query, schema: { type: string, format: uuid } }
        - { name: labelId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/IssueType" } }
        - { name: statusId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200": { description: Issues, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Issue" } } } } }
    post:
      tags: [Issues]
      summary: Create an issue (requires MEMBER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueCreateInput" }
      responses:
        "201": { description: Created issue, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
  /issues/mine:
    get:
      tags: [Issues]
      summary: Issues assigned to the caller, across every project they belong to
      responses:
        "200": { description: Issues, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Issue" } } } } }
  /issues/{issueId}:
    parameters: [{ $ref: "#/components/parameters/IssueId" }]
    get:
      tags: [Issues]
      summary: Get an issue with its comments, activity log and links (requires VIEWER on its project)
      responses:
        "200": { description: Issue detail, content: { application/json: { schema: { $ref: "#/components/schemas/IssueDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Issues]
      summary: Update an issue (requires MEMBER)
      description: >
        Changing `statusId` is validated against the project's configured
        workflow transitions (see Workflow) and, on success, fires the
        `issue.statusChanged` webhook event in addition to `issue.updated`.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueUpdateInput" }
      responses:
        "200": { description: Updated issue, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Issues]
      summary: Delete an issue (requires project ADMIN)
      responses:
        "204": { description: Deleted }
  /issues/{issueId}/links:
    parameters: [{ $ref: "#/components/parameters/IssueId" }]
    post:
      tags: [Issues]
      summary: Link this issue to another (requires MEMBER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linkedIssueId, type]
              properties:
                linkedIssueId: { type: string, format: uuid }
                type: { type: string, enum: [BLOCKS, RELATES_TO, DUPLICATES] }
      responses:
        "201": { description: Created link, content: { application/json: { schema: { $ref: "#/components/schemas/IssueLink" } } } }
  /issues/{issueId}/links/{linkId}:
    parameters:
      - { $ref: "#/components/parameters/IssueId" }
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Issues]
      summary: Remove an issue link (requires MEMBER)
      responses:
        "204": { description: Removed }
  /issues/{issueId}/sprint:
    parameters: [{ $ref: "#/components/parameters/IssueId" }]
    patch:
      tags: [Issues]
      summary: Move an issue into a sprint or back to the backlog (requires MEMBER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sprintId]
              properties:
                sprintId: { type: string, format: uuid, nullable: true, description: "null moves the issue to the backlog" }
      responses:
        "200": { description: Updated issue, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }

  # --- Board ------------------------------------------------------------
  /projects/{projectId}/board:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Board]
      summary: Get the board (every workflow status as a column, with its issues) (requires VIEWER)
      responses:
        "200":
          description: Board columns
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items:
                      type: object
                      properties:
                        status: { $ref: "#/components/schemas/WorkflowStatus" }
                        issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
  /projects/{projectId}/board/reorder:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [Board]
      summary: Move an issue to another column and/or reorder a column (requires MEMBER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueId, toStatusId, orderedIssueIds]
              properties:
                issueId: { type: string, format: uuid }
                toStatusId: { type: string, format: uuid }
                orderedIssueIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }

  # --- Workflow ---------------------------------------------------------
  /projects/{projectId}/workflow:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Workflow]
      summary: Get a project's statuses and transition rules (requires VIEWER)
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema:
                type: object
                properties:
                  statuses: { type: array, items: { $ref: "#/components/schemas/WorkflowStatus" } }
                  transitions: { type: array, items: { $ref: "#/components/schemas/WorkflowTransition" } }
  /projects/{projectId}/workflow/statuses:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [Workflow]
      summary: Create a workflow status (requires project ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string, maxLength: 100 }
                category: { $ref: "#/components/schemas/StatusCategory" }
                color: { type: string, nullable: true }
                isDefault: { type: boolean }
                wipLimit: { type: integer, nullable: true }
      responses:
        "201": { description: Created status, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowStatus" } } } }
  /projects/{projectId}/workflow/statuses/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Workflow]
      summary: Update a workflow status (requires project ADMIN)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                category: { $ref: "#/components/schemas/StatusCategory" }
                color: { type: string, nullable: true }
                order: { type: integer }
                isDefault: { type: boolean }
                wipLimit: { type: integer, nullable: true }
      responses:
        "200": { description: Updated status, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowStatus" } } } }
    delete:
      tags: [Workflow]
      summary: Delete a workflow status (requires project ADMIN; fails if issues use it or it is the default)
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/workflow/transitions:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    put:
      tags: [Workflow]
      summary: Replace the project's full set of allowed transitions (requires project ADMIN)
      description: An empty array clears all restrictions (any status can move to any other).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transitions]
              properties:
                transitions:
                  type: array
                  items:
                    type: object
                    required: [toStatusId]
                    properties:
                      fromStatusId: { type: string, format: uuid, nullable: true, description: "null means from-any-status" }
                      toStatusId: { type: string, format: uuid }
      responses:
        "200": { description: Final transition set, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowTransition" } } } } }

  # --- Sprints / Backlog / Reports --------------------------------------
  /projects/{projectId}/sprints:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Sprints]
      summary: List a project's sprints (requires VIEWER)
      responses:
        "200": { description: Sprints, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Sprint" } } } } }
    post:
      tags: [Sprints]
      summary: Create a sprint (requires MEMBER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                goal: { type: string, nullable: true, maxLength: 2000 }
      responses:
        "201": { description: Created sprint, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
  /projects/{projectId}/backlog:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Backlog]
      summary: Get the backlog (active/planned sprints with their issues, plus unassigned issues) (requires VIEWER)
      responses:
        "200":
          description: Backlog
          content:
            application/json:
              schema:
                type: object
                properties:
                  sprints: { type: array, items: { $ref: "#/components/schemas/Sprint" } }
                  backlog: { type: array, items: { $ref: "#/components/schemas/Issue" } }
  /projects/{projectId}/backlog/reorder:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [Backlog]
      summary: Move an issue into the backlog and reorder it (requires MEMBER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueId, orderedIssueIds]
              properties:
                issueId: { type: string, format: uuid }
                orderedIssueIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
  /projects/{projectId}/reports/velocity:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Reports]
      summary: Committed vs. completed story points per completed sprint (requires VIEWER)
      responses:
        "200": { description: Velocity points, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/VelocityPoint" } } } } }
  /projects/{projectId}/reports/cfd:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Reports]
      summary: Cumulative Flow Diagram data (requires VIEWER)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: CFD points, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CFDPoint" } } } } }
  /sprints/{sprintId}:
    parameters: [{ $ref: "#/components/parameters/SprintId" }]
    patch:
      tags: [Sprints]
      summary: Rename a sprint / change its goal (requires MEMBER; fails if COMPLETED)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                goal: { type: string, nullable: true }
      responses:
        "200": { description: Updated sprint, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
  /sprints/{sprintId}/start:
    parameters: [{ $ref: "#/components/parameters/SprintId" }]
    post:
      tags: [Sprints]
      summary: Start a sprint (requires MEMBER; only one ACTIVE sprint per project)
      description: Fires the `sprint.started` webhook event.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { durationDays: { type: integer, minimum: 1, maximum: 90, default: 14 } }
      responses:
        "200": { description: Started sprint, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /sprints/{sprintId}/complete:
    parameters: [{ $ref: "#/components/parameters/SprintId" }]
    post:
      tags: [Sprints]
      summary: Complete the active sprint (requires MEMBER)
      description: >
        Unfinished issues move to `moveToSprintId` (a planned sprint) or back
        to the backlog. Fires the `sprint.completed` webhook event.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { moveToSprintId: { type: string, format: uuid } }
      responses:
        "200": { description: Completed sprint, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
  /sprints/{sprintId}/burndown:
    parameters: [{ $ref: "#/components/parameters/SprintId" }]
    get:
      tags: [Sprints]
      summary: Day-by-day burndown for a started sprint (requires VIEWER)
      responses:
        "200":
          description: Burndown
          content:
            application/json:
              schema:
                type: object
                properties:
                  sprintId: { type: string, format: uuid }
                  totalPoints: { type: number }
                  points: { type: array, items: { $ref: "#/components/schemas/BurndownPoint" } }

  # --- Labels / Custom Fields --------------------------------------------
  /projects/{projectId}/labels:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Labels]
      summary: List a project's labels (requires VIEWER)
      responses:
        "200": { description: Labels, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Label" } } } } }
    post:
      tags: [Labels]
      summary: Create a label (requires MEMBER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 50 }
                color: { type: string, default: "#6366f1" }
      responses:
        "201": { description: Created label, content: { application/json: { schema: { $ref: "#/components/schemas/Label" } } } }
  /projects/{projectId}/labels/{labelId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Labels]
      summary: Delete a label (requires MEMBER)
      responses:
        "204": { description: Deleted }
  /projects/{projectId}/custom-fields:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Custom Fields]
      summary: List a project's custom field definitions (requires VIEWER)
      responses:
        "200": { description: Definitions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CustomFieldDefinition" } } } } }
    post:
      tags: [Custom Fields]
      summary: Create a custom field definition (requires project ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, fieldType]
              properties:
                name: { type: string, maxLength: 100 }
                fieldType: { $ref: "#/components/schemas/CustomFieldType" }
                options: { type: array, items: { type: string }, description: "Required (non-empty) for fieldType=SELECT" }
                required: { type: boolean }
      responses:
        "201": { description: Created definition, content: { application/json: { schema: { $ref: "#/components/schemas/CustomFieldDefinition" } } } }
  /projects/{projectId}/custom-fields/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Custom Fields]
      summary: Update a custom field definition (requires project ADMIN)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                options: { type: array, items: { type: string } }
                required: { type: boolean }
                order: { type: integer }
      responses:
        "200": { description: Updated definition, content: { application/json: { schema: { $ref: "#/components/schemas/CustomFieldDefinition" } } } }
    delete:
      tags: [Custom Fields]
      summary: Delete a custom field definition and all its values (requires project ADMIN)
      responses:
        "204": { description: Deleted }

  # --- Filters / Query ----------------------------------------------------
  /projects/{projectId}/query:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [Filters]
      summary: Run a JQL-like query scoped to one project (requires VIEWER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [query], properties: { query: { type: string, maxLength: 4000 } } }
      responses:
        "200": { description: Matching issues, content: { application/json: { schema: { $ref: "#/components/schemas/QueryResult" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
  /issues/query:
    post:
      tags: [Filters]
      summary: Run a JQL-like query across every project the caller can see
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [query], properties: { query: { type: string, maxLength: 4000 } } }
      responses:
        "200": { description: Matching issues, content: { application/json: { schema: { $ref: "#/components/schemas/QueryResult" } } } }
  /filters:
    get:
      tags: [Filters]
      summary: List saved filters visible to the caller
      responses:
        "200": { description: Filters, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SavedFilter" } } } } }
    post:
      tags: [Filters]
      summary: Save a filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, query]
              properties:
                name: { type: string, maxLength: 100 }
                query: { type: string, maxLength: 4000 }
                projectId: { type: string, format: uuid, nullable: true, description: "null = cross-project" }
                isShared: { type: boolean }
      responses:
        "201": { description: Created filter, content: { application/json: { schema: { $ref: "#/components/schemas/SavedFilter" } } } }
  /filters/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Filters]
      summary: Update a saved filter (owner only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                query: { type: string }
                projectId: { type: string, format: uuid, nullable: true }
                isShared: { type: boolean }
      responses:
        "200": { description: Updated filter, content: { application/json: { schema: { $ref: "#/components/schemas/SavedFilter" } } } }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Filters]
      summary: Delete a saved filter (owner only)
      responses:
        "204": { description: Deleted }
  /filters/{id}/run:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Filters]
      summary: Run a saved filter (owner, or any viewer if isShared)
      responses:
        "200": { description: Matching issues, content: { application/json: { schema: { $ref: "#/components/schemas/QueryResult" } } } }

  # --- Comments -----------------------------------------------------------
  /issues/{issueId}/comments:
    parameters: [{ $ref: "#/components/parameters/IssueId" }]
    post:
      tags: [Comments]
      summary: Add a comment (requires MEMBER)
      description: >
        Notifies the assignee (if different from the author) and any
        `@mention`ed project member, and fires the `comment.created`
        webhook event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 10000 } } }
      responses:
        "201": { description: Created comment, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
  /issues/{issueId}/comments/{commentId}:
    parameters:
      - { $ref: "#/components/parameters/IssueId" }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Comments]
      summary: Edit a comment (requires MEMBER; author or system ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 10000 } } }
      responses:
        "200": { description: Updated comment, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Comments]
      summary: Delete a comment (requires MEMBER; author or system ADMIN only)
      responses:
        "204": { description: Deleted }

  # --- Attachments ---------------------------------------------------------
  /issues/{issueId}/attachments:
    parameters: [{ $ref: "#/components/parameters/IssueId" }]
    get:
      tags: [Attachments]
      summary: List an issue's attachments (requires VIEWER)
      responses:
        "200": { description: Attachments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Attachment" } } } } }
    post:
      tags: [Attachments]
      summary: Upload an attachment (requires MEMBER)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Created attachment, content: { application/json: { schema: { $ref: "#/components/schemas/Attachment" } } } }
        "413": { $ref: "#/components/responses/Error" }
  /attachments/{id}/download:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Attachments]
      summary: Download an attachment (requires VIEWER on its issue's project)
      description: "Always served as `application/octet-stream` with `Content-Disposition: attachment`, regardless of the uploaded file's real type — see the route's security note on stored-XSS."
      responses:
        "200": { description: File bytes, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /attachments/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [Attachments]
      summary: Delete an attachment (requires VIEWER; uploader or project ADMIN only)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }

  # --- Notifications --------------------------------------------------------
  /notifications:
    get:
      tags: [Notifications]
      summary: List the caller's most recent 50 notifications
      responses:
        "200": { description: Notifications, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Notification" } } } } }
  /notifications/{id}/read:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Notifications]
      summary: Mark one notification read
      responses:
        "200": { description: Count updated, content: { application/json: { schema: { type: object, properties: { updated: { type: integer } } } } } }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all of the caller's notifications read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }

  # --- Admin: branding & SMTP ------------------------------------------------
  /branding:
    get:
      tags: [Admin — Branding & SMTP]
      summary: Get public branding (logo, product name, colors) — unauthenticated
      security: []
      responses:
        "200": { description: Branding, content: { application/json: { schema: { $ref: "#/components/schemas/Branding" } } } }
  /admin/branding:
    get:
      tags: [Admin — Branding & SMTP]
      summary: Get branding settings (system ADMIN)
      responses:
        "200": { description: Branding, content: { application/json: { schema: { $ref: "#/components/schemas/Branding" } } } }
    put:
      tags: [Admin — Branding & SMTP]
      summary: Update branding settings (system ADMIN)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productName: { type: string }
                logoUrl: { type: string, nullable: true }
                faviconUrl: { type: string, nullable: true }
                primaryColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
                accentColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
      responses:
        "200": { description: Updated branding, content: { application/json: { schema: { $ref: "#/components/schemas/Branding" } } } }
  /admin/smtp:
    get:
      tags: [Admin — Branding & SMTP]
      summary: Get SMTP settings — password is never returned, only `passwordSet` (system ADMIN)
      responses:
        "200": { description: SMTP settings, content: { application/json: { schema: { $ref: "#/components/schemas/SmtpSettings" } } } }
    put:
      tags: [Admin — Branding & SMTP]
      summary: Update SMTP settings (system ADMIN)
      description: An empty-string `password` leaves the stored password unchanged; `null` clears it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string, nullable: true }
                port: { type: integer }
                secure: { type: boolean }
                username: { type: string, nullable: true }
                password: { type: string, nullable: true }
                fromAddress: { type: string, nullable: true }
      responses:
        "200": { description: Updated SMTP settings, content: { application/json: { schema: { $ref: "#/components/schemas/SmtpSettings" } } } }
  /admin/smtp/test:
    post:
      tags: [Admin — Branding & SMTP]
      summary: Send a test email to the caller (system ADMIN)
      responses:
        "200": { description: Sent }
        "502": { description: SMTP not configured or send failed }

  # --- Admin: users ---------------------------------------------------------
  /admin/users:
    get:
      tags: [Admin — Users]
      summary: List all users (system ADMIN)
      parameters: [{ $ref: "#/components/parameters/Search" }]
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } }
  /admin/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Admin — Users]
      summary: Change a user's system role (system ADMIN; blocked if it would leave zero active admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { $ref: "#/components/schemas/SystemRole" } } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
    delete:
      tags: [Admin — Users]
      summary: Permanently delete a user (system ADMIN; only if they have zero historical footprint — use deactivate otherwise)
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/deactivate:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Admin — Users]
      summary: Deactivate a user — blocks login, hides from assignee pickers, keeps history (system ADMIN)
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
  /admin/users/{id}/reactivate:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Admin — Users]
      summary: Reactivate a deactivated user (system ADMIN)
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }

  # --- Admin: invites ---------------------------------------------------------
  /admin/invites:
    get:
      tags: [Admin — Invites]
      summary: List all invites (system ADMIN)
      responses:
        "200": { description: Invites, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Invite" } } } } }
    post:
      tags: [Admin — Invites]
      summary: Invite a user by email (system ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/SystemRole" }
      responses:
        "201": { description: Invite created, content: { application/json: { schema: { $ref: "#/components/schemas/InviteCreateResult" } } } }
  /admin/invites/{id}/revoke:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Admin — Invites]
      summary: Revoke a pending invite (system ADMIN)
      responses:
        "200": { description: Updated invite, content: { application/json: { schema: { $ref: "#/components/schemas/Invite" } } } }
  /admin/invites/{id}/resend:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Admin — Invites]
      summary: Resend a pending invite with a fresh token/expiry (system ADMIN)
      responses:
        "200": { description: Invite resent, content: { application/json: { schema: { $ref: "#/components/schemas/InviteCreateResult" } } } }

  # --- Admin: teams ---------------------------------------------------------
  /admin/teams:
    get:
      tags: [Admin — Teams]
      summary: List teams (system ADMIN)
      responses:
        "200": { description: Teams, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Team" } } } } }
    post:
      tags: [Admin — Teams]
      summary: Create a team (system ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, description: { type: string, nullable: true } } }
      responses:
        "201": { description: Created team, content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } } }
  /admin/teams/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Admin — Teams]
      summary: Rename/describe a team (system ADMIN)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, description: { type: string, nullable: true } } }
      responses:
        "200": { description: Updated team, content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } } }
    delete:
      tags: [Admin — Teams]
      summary: Delete a team (system ADMIN)
      responses:
        "204": { description: Deleted }
  /admin/teams/{id}/members:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Admin — Teams]
      summary: List a team's members (system ADMIN)
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UserSummary" } } } } }
    post:
      tags: [Admin — Teams]
      summary: Add a member to a team (system ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId], properties: { userId: { type: string, format: uuid } } }
      responses:
        "201": { description: Added user, content: { application/json: { schema: { $ref: "#/components/schemas/UserSummary" } } } }
  /admin/teams/{id}/members/{userId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Admin — Teams]
      summary: Remove a member from a team (system ADMIN)
      responses:
        "204": { description: Removed }

  # --- Public invites ---------------------------------------------------------
  /invites/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Public Invites]
      summary: Look up an invite by its token — unauthenticated
      security: []
      responses:
        "200":
          description: Invite info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePublicInfo" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { description: Invite expired or no longer valid }
  /invites/{token}/accept:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Public Invites]
      summary: Accept an invite and create an account — unauthenticated
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "201": { $ref: "#/components/responses/AuthResult" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { description: Invite expired or no longer valid }

  # --- Me / Teams / Workload / Activity ----------------------------------
  /me/starred:
    get:
      tags: [Me]
      summary: List the caller's starred projects
      responses:
        "200": { description: Projects, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Project" } } } } }
  /teams:
    get:
      tags: [Teams]
      summary: List teams (name + member count) — read-only for any authenticated user
      responses:
        "200": { description: Teams, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Team" } } } } }
  /workload:
    get:
      tags: [Workload]
      summary: Cross-user workload breakdown for projects the caller administers
      description: Requires system ADMIN, or project ADMIN on at least one project.
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: teamId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Workload entries, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkloadEntry" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /workload/me:
    get:
      tags: [Workload]
      summary: The caller's own workload breakdown
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The caller's workload entry, or null
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/WorkloadEntry" }
                  - { type: "null" }
  /activity:
    get:
      tags: [Activity]
      summary: Cross-project activity feed, scoped to the caller's projects
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: field, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Activity feed page
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/ActivityLogEntry" } }
                  nextCursor: { type: string, format: uuid, nullable: true }
  /activity/actors:
    get:
      tags: [Activity]
      summary: Users who have visible activity, for the activity feed's filter
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UserSummary" } } } } }

  # --- Webhooks ---------------------------------------------------------
  /projects/{projectId}/webhooks:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Webhooks]
      summary: List a project's webhooks (requires project ADMIN)
      responses:
        "200": { description: Webhooks (secrets masked), content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Webhook" } } } } }
    post:
      tags: [Webhooks]
      summary: Create a webhook (requires project ADMIN)
      description: >
        A random 32-byte signing secret is generated server-side. The
        response to THIS call is the only place the raw secret is ever
        returned — every later GET returns only `secretMasked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEventType" }
      responses:
        "201":
          description: Created webhook, including the one-time raw secret
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Webhook" }
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string, description: "Raw HMAC-SHA256 signing key — shown only now." }
        "400": { $ref: "#/components/responses/ValidationError" }
  /projects/{projectId}/webhooks/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Webhooks]
      summary: Update a webhook's URL, subscribed events, or active state (requires project ADMIN)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                events: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
                isActive: { type: boolean }
      responses:
        "200": { description: Updated webhook, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook and its delivery log (requires project ADMIN)
      responses:
        "204": { description: Deleted }
  /projects/{projectId}/webhooks/{id}/deliveries:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Webhooks]
      summary: Recent delivery log for a webhook (requires project ADMIN)
      responses:
        "200": { description: Up to 50 most recent deliveries, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } } } } }
  /projects/{projectId}/webhooks/{id}/test:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Webhooks]
      summary: Send a synthetic test event immediately and return the delivery result (requires project ADMIN)
      responses:
        "200":
          description: Delivery result
          content:
            application/json:
              schema:
                type: object
                properties:
                  succeeded: { type: boolean }
                  responseStatus: { type: integer, nullable: true }
                  durationMs: { type: integer }
                  attempts: { type: integer, description: "1, or 2 if the first attempt failed and was retried once" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Obtain via `POST /auth/login`, `POST /auth/register`, or `POST /invites/{token}/accept`.

  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    IssueId: { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
    SprintId: { name: sprintId, in: path, required: true, schema: { type: string, format: uuid } }
    Search: { name: search, in: query, schema: { type: string } }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    AuthResult:
      description: Token and user
      content:
        application/json:
          schema:
            type: object
            properties:
              token: { type: string }
              user: { $ref: "#/components/schemas/UserSummary" }

  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    ValidationError:
      type: object
      properties:
        error: { type: string, example: "Validation failed" }
        details: { type: object, description: "zod's flatten() output" }

    SystemRole: { type: string, enum: [ADMIN, MEMBER] }
    ProjectRole: { type: string, enum: [ADMIN, MEMBER, VIEWER] }
    IssueType: { type: string, enum: [EPIC, STORY, TASK, BUG, SUBTASK] }
    IssuePriority: { type: string, enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST] }
    StatusCategory: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
    CustomFieldType: { type: string, enum: [TEXT, NUMBER, DATE, SELECT, CHECKBOX] }
    InviteStatus: { type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED] }
    WebhookEventType:
      type: string
      enum:
        - issue.created
        - issue.updated
        - issue.statusChanged
        - comment.created
        - sprint.started
        - sprint.completed

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/SystemRole" }

    AdminUser:
      allOf:
        - { $ref: "#/components/schemas/UserSummary" }
        - type: object
          properties:
            deactivatedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        leadId: { type: string, format: uuid, nullable: true }
        issueCounter: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectMember:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/ProjectRole" }

    WorkflowStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: "#/components/schemas/StatusCategory" }
        order: { type: integer }
        color: { type: string, nullable: true }
        isDefault: { type: boolean }
        wipLimit: { type: integer, nullable: true }

    WorkflowTransition:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        fromStatusId: { type: string, format: uuid, nullable: true }
        toStatusId: { type: string, format: uuid }

    Label:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }

    CustomFieldDefinition:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        fieldType: { $ref: "#/components/schemas/CustomFieldType" }
        options: { type: array, items: { type: string }, nullable: true }
        required: { type: boolean }
        order: { type: integer }

    IssueCustomField:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        fieldType: { $ref: "#/components/schemas/CustomFieldType" }
        options: { type: array, items: { type: string }, nullable: true }
        required: { type: boolean }
        order: { type: integer }
        value: {}

    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
        uploadedBy: { $ref: "#/components/schemas/UserSummary" }

    Issue:
      type: object
      description: >
        The project-admin-configured custom fields for this issue's project
        are always returned in full under `customFields` (one entry per
        definition, `value: null` if unset).
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: "PROJ-123" }
        projectId: { type: string, format: uuid }
        number: { type: integer }
        type: { $ref: "#/components/schemas/IssueType" }
        title: { type: string }
        description: { type: string, nullable: true }
        descriptionJson: { type: object, nullable: true, description: "Tiptap document JSON" }
        statusId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/WorkflowStatus" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assigneeId: { type: string, format: uuid, nullable: true }
        assignee: { allOf: [{ $ref: "#/components/schemas/UserSummary" }], nullable: true }
        reporterId: { type: string, format: uuid }
        reporter: { $ref: "#/components/schemas/UserSummary" }
        parentId: { type: string, format: uuid, nullable: true }
        sprintId: { type: string, format: uuid, nullable: true }
        storyPoints: { type: integer, nullable: true }
        dueDate: { type: string, format: date-time, nullable: true }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        customFields: { type: array, items: { $ref: "#/components/schemas/IssueCustomField" } }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IssueCreateInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        descriptionJson: { type: object, nullable: true }
        type: { $ref: "#/components/schemas/IssueType" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        statusId: { type: string, format: uuid, description: "Defaults to the project's default workflow status" }
        assigneeId: { type: string, format: uuid, nullable: true }
        parentId: { type: string, format: uuid, nullable: true }
        storyPoints: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        dueDate: { type: string, nullable: true, description: "YYYY-MM-DD or full ISO datetime" }
        labelIds: { type: array, items: { type: string, format: uuid } }
        customFieldValues:
          type: array
          items:
            type: object
            properties:
              fieldDefinitionId: { type: string, format: uuid }
              value: { oneOf: [{ type: string }, { type: number }, { type: boolean }, { type: "null" }] }

    IssueUpdateInput:
      allOf:
        - { $ref: "#/components/schemas/IssueCreateInput" }
      description: Every field is optional on update.

    IssueLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        linkedIssueId: { type: string, format: uuid }
        type: { type: string, enum: [BLOCKS, RELATES_TO, DUPLICATES] }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        body: { type: string }
        author: { $ref: "#/components/schemas/UserSummary" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ActivityLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        field: { type: string }
        oldValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }
        actor: { $ref: "#/components/schemas/UserSummary" }
        createdAt: { type: string, format: date-time }

    IssueDetail:
      allOf:
        - { $ref: "#/components/schemas/Issue" }
        - type: object
          properties:
            comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
            activity: { type: array, items: { $ref: "#/components/schemas/ActivityLogEntry" } }
            links: { type: array, items: { $ref: "#/components/schemas/IssueLink" } }

    SprintStatus: { type: string, enum: [PLANNED, ACTIVE, COMPLETED] }
    Sprint:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        goal: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/SprintStatus" }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    BurndownPoint:
      type: object
      properties:
        date: { type: string, format: date }
        totalPoints: { type: number }
        remainingPoints: { type: number }

    VelocityPoint:
      type: object
      properties:
        sprintId: { type: string, format: uuid }
        sprintName: { type: string }
        committedPoints: { type: number }
        completedPoints: { type: number }
        completedAt: { type: string, format: date-time }

    CFDPoint:
      type: object
      description: Issue count per workflow status category, per day.
      additionalProperties: true

    QueryResult:
      type: object
      properties:
        issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }

    SavedFilter:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        query: { type: string }
        ownerId: { type: string, format: uuid }
        projectId: { type: string, format: uuid, nullable: true }
        isShared: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { type: string, enum: [ISSUE_ASSIGNED, COMMENT_MENTION, COMMENT_ADDED, ISSUE_STATUS_CHANGED] }
        payload: { type: object }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    Branding:
      type: object
      properties:
        productName: { type: string }
        logoUrl: { type: string, nullable: true }
        faviconUrl: { type: string, nullable: true }
        primaryColor: { type: string }
        accentColor: { type: string }

    SmtpSettings:
      type: object
      properties:
        host: { type: string }
        port: { type: integer }
        secure: { type: boolean }
        username: { type: string }
        fromAddress: { type: string }
        passwordSet: { type: boolean, description: "True if a password is stored. The password itself is never returned." }

    Invite:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/SystemRole" }
        status: { $ref: "#/components/schemas/InviteStatus" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }

    InviteCreateResult:
      type: object
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        inviteLink: { type: string, format: uri }
        emailSent: { type: boolean }
        emailReason: { type: string, nullable: true }

    InvitePublicInfo:
      type: object
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/SystemRole" }
        expiresAt: { type: string, format: date-time }

    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    WorkloadEntry:
      type: object
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
        issueCount: { type: integer }
        storyPoints: { type: number }
        byProject:
          type: array
          items:
            type: object
            properties:
              projectId: { type: string, format: uuid }
              key: { type: string }
              name: { type: string }
              issueCount: { type: integer }
              storyPoints: { type: number }
        byPriority:
          type: object
          additionalProperties: { type: number }

    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        url: { type: string, format: uri }
        secretMasked: { type: string, example: "a1b2••••••••c3d4" }
        events: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastTriggeredAt: { type: string, format: date-time, nullable: true }
        lastResponseStatus: { type: integer, nullable: true }

    WebhookDelivery:
      type: object
      description: >
        One row per delivery attempt (a retried delivery produces two rows).
        An external receiver verifies a delivery is genuine by computing
        `hex(HMAC_SHA256(secret, raw_request_body_bytes))` over the EXACT
        bytes it received (not a re-serialization of the parsed JSON — key
        order/whitespace are not guaranteed to round-trip) and comparing the
        result, in constant time, to the `X-Webhook-Signature` header. The
        request body is `{event, timestamp, project: {id, key, name}, data}`.
      properties:
        id: { type: string, format: uuid }
        webhookId: { type: string, format: uuid }
        event: { type: string }
        payload: { type: object }
        responseStatus: { type: integer, nullable: true }
        succeeded: { type: boolean }
        durationMs: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
